name: DS31 — CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint, Install & Test
    runs-on: ubuntu-latest

    steps:
      # ─── Checkout ─────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ─── Python setup ─────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ─── Validate Kaggle credentials ───────────────────────────────────────
      - name: Verify Kaggle credentials
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          if [ -z "$KAGGLE_USERNAME" ] || [ -z "$KAGGLE_KEY" ]; then
            echo "ERROR: Kaggle credentials not configured in GitHub Secrets"
            echo "Set KAGGLE_USERNAME and KAGGLE_KEY in repository secrets"
            exit 1
          fi
          echo "✓ Kaggle credentials found"

      # ─── Install dependencies ─────────────────────────────────────────────
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ─── dbt packages ─────────────────────────────────────────────────────
      - name: Install dbt packages (dbt-utils)
        run: dbt deps --project-dir dbt_m5

      # ─── Download M5 data from Kaggle ─────────────────────────────────────
      - name: Download M5 dataset from Kaggle
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          mkdir -p data/raw
          kaggle competitions download \
            -c m5-forecasting-accuracy \
            -f sales_train_evaluation.csv \
            -f calendar.csv \
            -f sell_prices.csv \
            -p data/raw

      # ─── Run full pipeline ────────────────────────────────────────────────
      - name: Run pipeline (make all)
        run: make all

      # ─── Tests ────────────────────────────────────────────────────────────
      - name: Run pytest suite
        run: make test

      # ─── Upload reports as artifacts ──────────────────────────────────────
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: ds31-reports
          path: reports/
          retention-days: 7

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ds31:ci .

      - name: Smoke-test API container
        run: |
          docker run -d --name ds31-api -p 8000:8000 ds31:ci
          sleep 5
          curl -f http://localhost:8000/health
          docker stop ds31-api
