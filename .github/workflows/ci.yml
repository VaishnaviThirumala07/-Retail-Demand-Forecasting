name: DS31 — CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint, Install & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install dbt packages (dbt-utils)
        run: dbt deps --project-dir dbt_m5

      # The real M5 files are too large for git and can't be re-hosted, so CI
      # runs the whole pipeline on a small synthetic sample with the same schema.
      - name: Generate synthetic M5 sample data
        run: make sample-data

      - name: Run pipeline (make all)
        run: make all

      - name: Run pytest suite
        run: make test

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ds31-reports
          path: reports/
          retention-days: 7

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build -t ds31:ci .

      - name: Smoke-test API container
        run: |
          docker run -d --name ds31-api -p 8000:8000 ds31:ci
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 2
          done
          docker logs ds31-api
          exit 1
